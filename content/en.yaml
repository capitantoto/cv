  - id: education
    title: Academic Record
    kind: entries
    entries:
      - id: msc
        dates: 2017 – 21
        title: MSc in Mathematical Statistics
        org: Instituto del Cálculo, FCEyN, UBA
        desc: GPA 10.0
      - id: msc-thesis
        dates: Thesis
        title: Fermat Distance in Kernel Density Estimators
        note: in progress
        desc: >-
          I propose to train a KDE classifier with a data-learned distance —
          Fermat's Distance — instead of the customary Euclidean distance, in
          order to learn not only the sample density, but also its geometry
          (i.e. its supporting Riemannian manifold). I evaluate the classifier
          against related algorithms such as Naive Bayes, and state-of-the-art
          techniques such as GBTs and NNs. Publicly available at
          #link("https://github.com/capitantoto/tesis_mesis")[GitHub].
          Director: Pablo Groisman, Ph.D.
      - id: lic
        dates: 2009 – 14
        title: Licenciatura (≈ MSc) in Economics
        org: Facultad de Cs. Económicas, UBA
        desc: GPA 8.94. I graduated _magna cum laude_ as class valedictorian.
      - id: lic-thesis
        dates: Thesis
        title: The Limits of Electoral Predictability
        desc: >-
          Using open data from the 2013 legislative elections, I first ran a
          simulation study to estimate the minimum possible error in predicting
          the election's final result. In light of the results, I then assessed
          the credibility of several public opinion polls published right
          before voting day. Publicly available at
          #link("https://github.com/capitantoto/tesis_mesis")[GitHub].
          Director: Silvia Vietri, Ph.D. Grade: 10.0.

